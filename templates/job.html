{% extends "base.html" %}{% block title %}Searching · Lead Finder{% endblock %}{% block body %}
<div class="card jobcard" id=job data-id="{{ jid }}">
  <div class=spin id=spin></div>
  <h1>Finding businesses…</h1><p class=sub style="margin:0">{{ job.label }}</p>
  <div class=progress><i></i></div>
  <p id=jobtext class=hint>Starting…</p>
  <div id=jobmsg></div>
  <noscript><p class=flash>Turn on JavaScript to follow progress. Results are saved automatically; check the dashboard.</p></noscript>
</div>{% endblock %}
