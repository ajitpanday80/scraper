<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Places Admin</title>
<style>
body{font:15px system-ui;max-width:1100px;margin:0 auto;padding:1rem}
nav{display:flex;gap:1rem;align-items:center;border-bottom:1px solid #ddd;padding-bottom:.6rem;margin-bottom:1rem}
nav form{margin-left:auto}input,button{padding:.5rem;font:inherit}
table{border-collapse:collapse;width:100%;margin-top:1rem}td,th{border:1px solid #ccc;padding:.4rem;text-align:left;vertical-align:top}
.flash{background:#fde8e8;color:#900;padding:.6rem;border-radius:4px;margin:.5rem 0}
.wrap{overflow-x:auto}
</style>
{% if session.admin %}<nav><b>Places Admin</b><a href="{{ url_for('index') }}">Search</a><a href="{{ url_for('all_places') }}">All stored places</a>
<form method=post action="{{ url_for('logout') }}"><input type=hidden name=csrf value="{{ csrf }}"><button>Log out</button></form></nav>{% endif %}
{% for m in get_flashed_messages() %}<div class=flash>{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
