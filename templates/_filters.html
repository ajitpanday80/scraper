<form method=get class=toolbar>
  {% if scope is defined %}<input type=hidden name=scope value="{{ scope }}">{% endif %}
  <div class=grow><svg class="ic sm"><use href="#i-search"/></svg><input type=search name=q value="{{ f.text }}" placeholder="Search name, address, phone, notes"></div>
  <button class="btn sm">Apply</button>
  <a class="btn ghost sm" href="{{ csv_url }}"><svg class="ic sm"><use href="#i-dl"/></svg>Export CSV</a>
  <div class=break></div>
  {% if kws %}<select name=kw data-auto data-dd-wide aria-label="Keyword"><option value="">All keywords</option>
    {% for k in kws %}<option value="{{ k.keyword }}" {{ 'selected' if f.keyword==k.keyword }}>{{ k.keyword }} ({{ k.n }})</option>{% endfor %}</select>{% endif %}
  <select name=status data-auto aria-label="Status"><option value="">All statuses</option>{% for s in statuses %}<option {{ 'selected' if f.status==s }}>{{ s }}</option>{% endfor %}</select>
  <select name=sort data-auto aria-label="Sort">{% for k, l in [('newest','Newest first'),('name','Name A–Z'),('rating','Top rated'),('reviews','Most reviews')] %}<option value="{{ k }}" {{ 'selected' if f.sort==k }}>{{ l }}</option>{% endfor %}</select>
  <label><input type=checkbox data-auto name=phone value=1 {{ 'checked' if f.phone }}> Has phone</label>
  <label><input type=checkbox data-auto name=mobile value=1 {{ 'checked' if f.mobile }}> Mobile only</label>
</form>
